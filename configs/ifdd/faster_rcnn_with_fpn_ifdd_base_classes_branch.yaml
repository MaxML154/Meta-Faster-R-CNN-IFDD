_BASE_: "Base-IFDD-C4.yaml"
MODEL:
  WEIGHTS: "./output/fsod/meta_training_ifdd_resnet101_stage_3/model_final.pth"
  META_ARCHITECTURE: "GeneralizedRCNNForBase"
  MASK_ON: False
  RESNETS:
    DEPTH: 101
  ROI_HEADS:
    SCORE_THRESH_TEST: 0.05
  RPN:
    PRE_NMS_TOPK_TEST: 12000
    POST_NMS_TOPK_TEST: 100
OUTPUT_DIR: './output/fsod/faster_rcnn_with_fpn_ifdd_base_classes_branch'
DATASETS:
  TRAIN: ("ifdd_base_train",)
  TEST: ("ifdd_base_test",)
SOLVER:
  IMS_PER_BATCH: 16
  BASE_LR: 0.02
  STEPS: (10000, 20000)
  MAX_ITER: 20000
  WARMUP_ITERS: 1000
  CHECKPOINT_PERIOD: 20000
TEST:
  EVAL_PERIOD: 5000 